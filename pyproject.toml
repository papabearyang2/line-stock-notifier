[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-stock-linebot"
version = "0.1.0"
description = "LINE Bot for Taiwan stock watchlists, news, valuation charts and company research"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "playwright>=1.55,<2",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "vercel>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
